# Build a signed APK and publish a GitHub Release.
#
# How to publish:
#   1. Actions → Release → Run workflow → version を入力 (例: 1.2.0)
#   2. git tag v1.2.0 && git push origin v1.2.0
#   3. GitHub の Releases 画面から下書きを公開
#
# Optional repository secrets for a dedicated signing key:
#   RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD,
#   RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD
# Without them the APK is signed with the debug keystore so it is still installable.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "リリースバージョン (例: 1.2.0)。先頭の v は不要です"
        required: true
        type: string
      prerelease:
        description: "プレリリースとして公開する"
        required: false
        type: boolean
        default: false
  push:
    tags:
      - "v*"
  release:
    types: [published]

concurrency:
  group: release-${{ github.event.release.tag_name || (github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version)) || github.ref_name }}
  cancel-in-progress: true

jobs:
  release:
    name: Build and publish APK
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.actor != 'github-actions[bot]') ||
      (github.event_name == 'release' && github.actor != 'github-actions[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            workflow_dispatch) VERSION="$INPUT_VERSION" ;;
            release) VERSION="$RELEASE_TAG" ;;
            *) VERSION="$REF_NAME" ;;
          esac
          VERSION="${VERSION#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?([.-].*)?$ ]]; then
            echo "Invalid version: $VERSION"
            echo "Use a value like 1.2.0"
            exit 1
          fi
          BASE="${VERSION%%-*}"
          IFS='.' read -r major minor patch _ <<<"$BASE"
          major="${major:-0}"
          minor="${minor:-0}"
          patch="${patch:-0}"
          patch="${patch//[^0-9]/}"
          patch="${patch:-0}"
          VERSION_CODE=$((10#$major * 10000 + 10#$minor * 100 + 10#$patch))
          PRERELEASE=false
          if [[ "$INPUT_PRERELEASE" == "true" || "$RELEASE_PRERELEASE" == "true" || "$VERSION" == *-* ]]; then
            PRERELEASE=true
          fi
          {
            echo "name=$VERSION"
            echo "tag=v$VERSION"
            echo "code=$VERSION_CODE"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"
          echo "Release $VERSION (versionCode=$VERSION_CODE, tag=v$VERSION)"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Import release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_KEYSTORE_BASE64" ]]; then
            echo "RELEASE_KEYSTORE_BASE64 is not set; signing with the debug keystore."
            exit 0
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$HOME/release.jks"
          {
            echo "RELEASE_KEYSTORE_FILE=$HOME/release.jks"
            echo "RELEASE_KEYSTORE_PASSWORD=$RELEASE_KEYSTORE_PASSWORD"
            echo "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS"
            echo "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        run: |
          ./gradlew assembleRelease --stacktrace --no-daemon \
            -PappVersionName="${{ steps.version.outputs.name }}" \
            -PappVersionCode="${{ steps.version.outputs.code }}"

      - name: Prepare APK artifact
        id: apk
        run: |
          set -euo pipefail
          SRC="app/build/outputs/apk/release/app-release.apk"
          DEST="ShutterMute-${{ steps.version.outputs.name }}.apk"
          test -f "$SRC"
          cp "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.name }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          set -euo pipefail
          extra=()
          if [[ "$PRERELEASE" == "true" ]]; then
            extra+=(--prerelease)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" --title "ShutterMute $VERSION" "${extra[@]}"
          else
            gh release create "$TAG" "$APK" \
              --title "ShutterMute $VERSION" \
              --generate-notes \
              --target "${{ github.sha }}" \
              "${extra[@]}"
          fi

      - name: Upload APK to workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ShutterMute-${{ steps.version.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Summary
        run: |
          {
            echo "## ShutterMute ${{ steps.version.outputs.name }}"
            echo ""
            echo "- Tag: \`${{ steps.version.outputs.tag }}\`"
            echo "- versionCode: \`${{ steps.version.outputs.code }}\`"
            echo "- APK: \`ShutterMute-${{ steps.version.outputs.name }}.apk\`"
            echo "- Release: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.version.outputs.tag }}"
          } >> "$GITHUB_STEP_SUMMARY"
